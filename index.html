<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Artist Scheduler</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  padding: 10px;
  background: #111;
  color: white;
}

.container {
  display: flex;
  height: calc(100vh - 50px);
}

/* 左边艺人池 */
.left {
  width: 250px;
  background: white;
  padding: 10px;
  overflow-y: auto;
  border-right: 1px solid #ddd;
}

.artist {
  background: #eee;
  padding: 8px;
  margin-bottom: 8px;
  cursor: grab;
  border-radius: 6px;
}

.artist.red {
  background: #ffcccc;
}

/* 中间表 */
.center {
  flex: 1;
  padding: 10px;
}

.row {
  display: flex;
  margin-bottom: 10px;
}

.slot {
  flex: 1;
  min-height: 100px;
  background: white;
  margin-right: 10px;
  border-radius: 6px;
  padding: 5px;
  position: relative;
}

.slot:last-child {
  margin-right: 0;
}

.slot-title {
  font-size: 12px;
  color: gray;
}

.add-btn {
  position: absolute;
  bottom: 5px;
  right: 5px;
  font-size: 12px;
  cursor: pointer;
  color: #007bff;
}

.block {
  background: #dfefff;
  padding: 5px;
  margin-top: 5px;
  border-radius: 5px;
  cursor: grab;
}

.block.red {
  background: #ffcccc;
}

</style>
</head>
<body>

<header>
  🎤 Artist Scheduler (MVP)
</header>

<div class="container">

  <!-- 左边艺人池 -->
  <div class="left">
    <h4>Add Artist</h4>
    <input id="name" placeholder="Artist name"><br><br>
    <input id="time" placeholder="Arrival time (e.g. 14:00)"><br><br>
    <button onclick="addArtist()">Add</button>

    <hr>

    <div id="artistList"></div>
  </div>

  <!-- 中间表 -->
  <div class="center">
    
    <div class="row">
      <div class="slot" ondrop="drop(event)" ondragover="allowDrop(event)">
        <div class="slot-title">Arrival</div>
        <div class="add-btn" onclick="addFromSlot(this)">+ Add</div>
      </div>

      <div class="slot" ondrop="drop(event)" ondragover="allowDrop(event)">
        <div class="slot-title">Soundcheck</div>
        <div class="add-btn" onclick="addFromSlot(this)">+ Add</div>
      </div>

      <div class="slot" ondrop="drop(event)" ondragover="allowDrop(event)">
        <div class="slot-title">Show</div>
        <div class="add-btn" onclick="addFromSlot(this)">+ Add</div>
      </div>
    </div>

  </div>

</div>

<script>
let artists = JSON.parse(localStorage.getItem("artists") || "[]");

function save() {
  localStorage.setItem("artists", JSON.stringify(artists));
}

function render() {
  let list = document.getElementById("artistList");
  list.innerHTML = "";

  artists.forEach((a, i) => {
    let div = document.createElement("div");
    div.className = "artist";
    div.draggable = true;
    div.innerText = a.name + " (" + a.time + ")";
    div.ondragstart = (e) => {
      e.dataTransfer.setData("text", i);
    };
    list.appendChild(div);
  });
}

function addArtist() {
  let name = document.getElementById("name").value;
  let time = document.getElementById("time").value;

  if (!name) return;

  artists.push({ name, time });
  save();
  render();
}

function allowDrop(e) {
  e.preventDefault();
}

function drop(e) {
  e.preventDefault();
  let index = e.dataTransfer.getData("text");
  let artist = artists[index];

  let block = document.createElement("div");
  block.className = "block";
  block.innerText = artist.name + " (" + artist.time + ")";
  block.draggable = true;

  // 简单冲突检测（同时间）
  let blocks = e.target.querySelectorAll(".block");
  blocks.forEach(b => {
    if (b.innerText.includes(artist.time)) {
      block.classList.add("red");
    }
  });

  e.target.appendChild(block);
}

function addFromSlot(btn) {
  let name = prompt("Artist name?");
  let time = prompt("Time?");

  if (!name) return;

  let block = document.createElement("div");
  block.className = "block";
  block.innerText = name + " (" + time + ")";

  btn.parentElement.appendChild(block);
}

render();
</script>

</body>
</html>
